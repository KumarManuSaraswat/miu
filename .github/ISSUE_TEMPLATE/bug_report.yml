name: Bug report
description: Report a reproducible problem with Miu.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, follow SECURITY.md rather than posting details here.
        Do not include API keys, OAuth JSON, tokens, private email, personal recordings, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Miu version or source commit
      description: Include whether this is a portable release or a local build.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and device
      description: Include Windows version/build or Android version/phone model. Do not include device serial numbers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a harmless example command and synthetic text where possible.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: Include the visible error text after removing personal details.
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      options:
        - Interface, animation or floating mascot
        - Local command
        - Microphone recognition
        - Spoken reply
        - Gmail setup or lookup
        - WhatsApp screen reading or message review
        - Optional Gemini conversation
        - Companion presets or optional catalog
        - Build or packaging
        - Something else
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: For voice issues, say which engine is installed, whether the input meter moves, and whether typed commands work. No recording is required.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private content from this report and any attachments.
          required: true
