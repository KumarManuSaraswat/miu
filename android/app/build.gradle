plugins { id 'com.android.application' }

android {
    enableKotlin = false // Java-only app: omit Kotlin tasks and its automatic standard library.
    namespace 'io.github.kumarmanusaraswat.miu'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.kumarmanusaraswat.miu'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.0'
        testInstrumentationRunner 'io.github.kumarmanusaraswat.miu.MiuInstrumentation'
    }
    signingConfigs {
        if (System.getenv('MIU_KEYSTORE_PATH')) {
            release {
                storeFile file(System.getenv('MIU_KEYSTORE_PATH'))
                storePassword System.getenv('MIU_STORE_PASSWORD')
                keyAlias 'miu-android'
                keyPassword System.getenv('MIU_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            if (System.getenv('MIU_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/legal-assets')]
    // The public ready-to-use APK opts into verified build inputs. Plain source
    // builds stay small for command/UI tests and never download a model silently.
    if (providers.gradleProperty('withLocalAi').isPresent()) {
        defaultConfig.minSdk = 28 // Pinned native runtime's minimum Android API.
        defaultConfig.ndk.abiFilters.add('arm64-v8a')
        sourceSets.main.jniLibs.srcDirs += [rootProject.file('../.cache/local-ai/android/jniLibs')]
        sourceSets.main.assets.srcDirs += [rootProject.file('../.cache/local-ai/android/assets')]
        packaging.jniLibs.useLegacyPackaging = true
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

tasks.register('copyModelNotices', Copy) {
    from(rootProject.file('../licenses')) { include '*.txt' }
    into(layout.buildDirectory.dir('generated/legal-assets/legal'))
}
tasks.named('preBuild').configure { dependsOn('copyModelNotices') }

dependencies { testImplementation 'junit:junit:4.13.2' }
